name: Günlük yedek

# İki günde bir 20:00'de (TR) otomatik çalışır; ayrıca elle de çalıştırılabilir (Actions → Günlük yedek → Run workflow).
# Not: cron "ayın tek günlerinde" çalışır (1, 3, 5 ... 31); 31'i olan aylarda 31'i ile 1'i arası 1 gün olur.
# 20:00 TR = 17:00 UTC. Kapatmak için schedule satırlarının başına # koyun.
on:
  schedule:
    - cron: '0 17 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Yedek al (şifreli)
        env:
          BACKUP_USER: yedekbot
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_OUT_DIR: yedek-cikti
        run: node scripts/yedek-al.mjs

      - name: Yedeği sakla (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: biletpro-yedek-${{ github.run_id }}
          path: yedek-cikti/*.bpy
          retention-days: 90
          if-no-files-found: error
