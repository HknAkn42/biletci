<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BiletPro | Akıllı Erişim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="menu.js?v=20260330"></script>
    <script src="online-store.js?v=20260331"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        .glass-terminal {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }
        @media (max-width: 640px) {
            .glass-terminal {
                padding: 18px !important;
                border-radius: 22px !important;
                max-width: 98vw !important;
            }
            .input-premium {
                font-size: 1.1rem !important;
                padding: 1.3rem !important;
                border-radius: 14px !important;
            }
            .btn-main, .btn, button, input[type="button"], input[type="submit"] {
                min-height: 54px !important;
                font-size: 1.1rem !important;
                border-radius: 16px !important;
                touch-action: manipulation;
            }
            body, html {
                max-width: 100vw !important;
                overflow-x: hidden !important;
            }
        }
        .input-premium {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 20px !important;
            padding: 1.2rem !important;
            color: #fff !important;
            width: 100%;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: lowercase; /* Görsel olarak da küçük harfe zorlar */
            transition: 0.3s;
        }
        .input-premium:focus { border-color: #3b82f6 !important; background: rgba(255,255,255,0.1) !important; outline: none; }
        
        .pin-dot { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; transition: 0.3s; }
        .pin-dot.active { background: #3b82f6; border-color: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        
        .num-btn {
            width: 75px; height: 75px;
            border-radius: 22px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .num-btn:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
        .num-btn:active { background: #3b82f6; transform: scale(0.95); }

        .btn-main { background: #3b82f6; color: #fff; width: 100%; padding: 18px; border-radius: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 10px; }
        .btn-main:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.3); }

        .hidden { display: none; }
        .animate-fade { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        /* Toast bildirim */
        .login-toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-20px);
            padding: 14px 28px; border-radius: 16px; font-size: 13px; font-weight: 800;
            letter-spacing: 0.5px; z-index: 9999; opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px); pointer-events: none;
        }
        .login-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .login-toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .login-toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <div id="loginToast" class="login-toast"></div>
    <div class="glass-terminal" id="terminal">
        
        <div class="mb-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-xl overflow-hidden">
                <img id="loginBrandLogo" class="w-full h-full object-cover hidden" alt="Marka Logosu">
                <svg id="loginBrandIcon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase"><span data-brand-short>BILETPRO</span></h1>
            <p id="terminalSubtitle" data-brand-subtitle class="text-slate-500 font-bold text-[9px] uppercase tracking-[3px] mt-2">GÜVENLİ ERİŞİM SİSTEMİ</p>
        </div>

        <form id="stepLogin" class="animate-fade" onsubmit="event.preventDefault(); handleLogin();" autocomplete="on">
            <input type="text" id="username" class="input-premium" placeholder="Kullanıcı Adı" autocomplete="username" autocapitalize="none" spellcheck="false">
            <input type="password" id="password" class="input-premium" placeholder="Şifre" autocomplete="current-password" style="text-transform: none;">
            <button type="submit" id="loginBtn" class="btn-main">Giriş Yap</button>
            <p class="text-xs text-slate-500 mt-6 leading-relaxed">Hesabınız yok ya da şifrenizi unuttuysanız yöneticinizle iletişime geçin.</p>
        </form>

    </div>

    <script>
        const normalizeUsername = (v) => String(v || '').trim().toLowerCase();
        const ALL_PERMS = ['pSale','pDiscount','pCancel','pDoor','pDoorPay','pDoorRisk','pManageEvents','pReports','pManageStaff','pViewLogs'];
        let __busy = false;

        window.onload = async () => {
            if (typeof applyGlobalConfig === 'function') applyGlobalConfig();
            sessionStorage.removeItem('BiletPro_LoggedInTab');
            localStorage.removeItem('BiletPro_Session');
            const u = document.getElementById('username');
            if (u) u.focus();
            try { const km = sessionStorage.getItem('BiletPro_KickMsg'); if (km) { sessionStorage.removeItem('BiletPro_KickMsg'); showLoginToast(km, 'error'); } } catch (_) {}
        };

        async function handleLogin() {
            if (__busy) return;
            const username = normalizeUsername(document.getElementById('username').value);
            const password = document.getElementById('password').value;
            if (!username || !password) { showLoginToast('Kullanıcı adı ve şifre girin', 'error'); shakeTerminal(); return; }

            __busy = true;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Giriş yapılıyor…';
            try {
                const store = window.BiletProOnlineStore;
                const init = store && await store.init();
                if (!init || init.mode !== 'online') { showLoginToast('Sunucuya bağlanılamadı. İnternetinizi kontrol edin.', 'error'); return; }

                const res = await store.signIn(username, password);
                if (!res.ok) {
                    if (typeof window.writeAuditEvent === 'function') { /* oturum yok: sunucuya yazılamaz */ }
                    showLoginToast('Kullanıcı adı veya şifre hatalı', 'error');
                    shakeTerminal();
                    return;
                }

                // Rol ve kullanıcı adı yalnızca imzalı belirteçten gelir
                const auth = window.BiletProAuth.read();
                if (!auth) { showLoginToast('Oturum açılamadı', 'error'); return; }

                await store.pullStaffFromOnline();
                let staff = [];
                try { staff = JSON.parse(localStorage.getItem('BiletPro_Staff') || '[]'); } catch (_) {}
                if (!Array.isArray(staff)) staff = [];
                let rec = staff.find(x => normalizeUsername(x && x.username) === auth.username);

                if (!rec) {
                    if (auth.role !== 'admin') {
                        await store.signOut();
                        showLoginToast('Hesabınız personel listesinde yok. Yöneticinize başvurun.', 'error');
                        return;
                    }
                    // İlk yönetici girişi: personel listesine otomatik kaydedilir
                    const perms = {}; ALL_PERMS.forEach(k => perms[k] = true);
                    rec = { name: auth.username, username: auth.username, role: 'admin', isActive: true, perms, pin: null };
                    staff.push(rec);
                    localStorage.setItem('BiletPro_Staff', JSON.stringify(staff));
                    await store.pushStaffToOnline(staff);
                }
                if (rec.isActive === false) {
                    await store.signOut();
                    showLoginToast('Hesabınız pasif. Yöneticinize başvurun.', 'error');
                    return;
                }

                // Tek oturum: aynı hesap başka cihazda açıksa uyar
                let cl = await store.claimSession(deviceLabel(), false);
                if (cl && cl.ok === false && cl.reason === 'in_use') {
                    const go = await askTakeover(cl);
                    if (!go) { await store.signOut(); showLoginToast('Giriş iptal edildi', 'error'); return; }
                    cl = await store.claimSession(deviceLabel(), true);
                }
                if (cl && cl.ok && cl.session_id) localStorage.setItem('BiletPro_SessionId', cl.session_id);
                else localStorage.removeItem('BiletPro_SessionId');

                loginComplete({ name: rec.name || auth.username, role: auth.role, username: auth.username });
            } catch (err) {
                console.error('[login]', err);
                showLoginToast('Beklenmeyen bir hata oluştu', 'error');
            } finally {
                __busy = false;
                btn.disabled = false; btn.textContent = 'Giriş Yap';
            }
        }

        function deviceLabel() {
            const ua = navigator.userAgent || '';
            const os = /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Cihaz';
            const br = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : 'Tarayıcı';
            return br + ' · ' + os;
        }

        function askTakeover(info) {
            return new Promise((resolve) => {
                const ago = info.last_seen ? Math.max(0, Math.round((Date.now() - new Date(info.last_seen).getTime()) / 1000)) : null;
                const when = ago == null ? '' : (ago < 60 ? ago + ' sn önce' : Math.round(ago / 60) + ' dk önce');
                const ov = document.createElement('div');
                ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(8,12,24,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px';
                ov.innerHTML = '<div style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);text-align:left">' +
                    '<div style="font-size:18px;font-weight:700;margin-bottom:8px">Bu hesap başka cihazda açık</div>' +
                    '<div style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:18px">Hesabınız şu anda <b style="color:var(--text)">' + (info.device || 'başka bir cihazda') + '</b> üzerinde açık' + (when ? ' (son hareket ' + when + ')' : '') + '. Devam ederseniz o cihazın oturumu kapatılır.</div>' +
                    '<div style="display:flex;gap:10px"><button id="toCancel" style="flex:1;height:46px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:650;cursor:pointer">Vazgeç</button>' +
                    '<button id="toGo" style="flex:1.6;height:46px;border-radius:12px;border:0;background:var(--primary);color:#fff;font-weight:650;cursor:pointer">Devam et, diğerini kapat</button></div></div>';
                document.body.appendChild(ov);
                ov.querySelector('#toCancel').onclick = () => { ov.remove(); resolve(false); };
                ov.querySelector('#toGo').onclick = () => { ov.remove(); resolve(true); };
            });
        }

        function loginComplete(userData) {
            localStorage.setItem('BiletPro_Session', JSON.stringify({
                name: userData.name,
                role: userData.role,
                username: userData.username,
                time: new Date().toISOString()
            }));
            sessionStorage.setItem('BiletPro_LoggedInTab', '1');
            localStorage.setItem('BiletPro_LastActivity', Date.now().toString());
            if (typeof window.writeAuditEvent === 'function') {
                window.writeAuditEvent('Güvenlik', 'Oturum Açıldı', `${userData.name || userData.username} sisteme giriş yaptı.`);
            }
            showLoginToast(`Hoş geldin, ${userData.name || userData.username}`, 'success');
            setTimeout(() => {
                const t = document.getElementById('terminal');
                t.style.opacity = '0'; t.style.transform = 'scale(0.97)'; t.style.transition = '0.4s';
            }, 500);
            setTimeout(() => { window.location.href = 'index.html'; }, 900);
        }

        function shakeTerminal() {
            const t = document.getElementById('terminal');
            t.classList.add('shake');
            setTimeout(() => t.classList.remove('shake'), 400);
        }

        let __toastTimer = null;
        function showLoginToast(message, type) {
            const toast = document.getElementById('loginToast');
            toast.textContent = message;
            toast.className = 'login-toast ' + type;
            clearTimeout(__toastTimer);
            requestAnimationFrame(() => { toast.classList.add('show'); });
            __toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3200);
        }
    </script>
</body>
</html>
