<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BiletPro | Akıllı Erişim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="menu.js?v=20260330"></script>
    <script src="online-store.js?v=20260331"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        .glass-terminal {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }
        @media (max-width: 640px) {
            .glass-terminal {
                padding: 18px !important;
                border-radius: 22px !important;
                max-width: 98vw !important;
            }
            .input-premium {
                font-size: 1.1rem !important;
                padding: 1.3rem !important;
                border-radius: 14px !important;
            }
            .btn-main, .btn, button, input[type="button"], input[type="submit"] {
                min-height: 54px !important;
                font-size: 1.1rem !important;
                border-radius: 16px !important;
                touch-action: manipulation;
            }
            body, html {
                max-width: 100vw !important;
                overflow-x: hidden !important;
            }
        }
        .input-premium {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 20px !important;
            padding: 1.2rem !important;
            color: #fff !important;
            width: 100%;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: lowercase; /* Görsel olarak da küçük harfe zorlar */
            transition: 0.3s;
        }
        .input-premium:focus { border-color: #3b82f6 !important; background: rgba(255,255,255,0.1) !important; outline: none; }
        
        .pin-dot { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; transition: 0.3s; }
        .pin-dot.active { background: #3b82f6; border-color: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        
        .num-btn {
            width: 75px; height: 75px;
            border-radius: 22px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .num-btn:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
        .num-btn:active { background: #3b82f6; transform: scale(0.95); }

        .btn-main { background: #3b82f6; color: #fff; width: 100%; padding: 18px; border-radius: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 10px; }
        .btn-main:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.3); }

        .hidden { display: none; }
        .animate-fade { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        /* Toast bildirim */
        .login-toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-20px);
            padding: 14px 28px; border-radius: 16px; font-size: 13px; font-weight: 800;
            letter-spacing: 0.5px; z-index: 9999; opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px); pointer-events: none;
        }
        .login-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .login-toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .login-toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <div id="loginToast" class="login-toast"></div>
    <div class="glass-terminal" id="terminal">
        
        <div class="mb-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-xl overflow-hidden">
                <img id="loginBrandLogo" class="w-full h-full object-cover hidden" alt="Marka Logosu">
                <svg id="loginBrandIcon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase"><span data-brand-short>BILETPRO</span></h1>
            <p id="terminalSubtitle" data-brand-subtitle class="text-slate-500 font-bold text-[9px] uppercase tracking-[3px] mt-2">GÜVENLİ ERİŞİM SİSTEMİ</p>
        </div>

        <div id="stepLogin" class="animate-fade">
            <input type="text" id="username" class="input-premium" placeholder="Kullanıcı Adı">
            <input type="password" id="password" class="input-premium" placeholder="Şifre" style="text-transform: none;">
            <button onclick="handleInitialLogin()" class="btn-main">GİRİŞİ KAYDET</button>
        </div>

        <div id="stepSetup" class="hidden animate-fade">
            <p class="text-xs font-bold text-slate-300 mb-6 leading-relaxed">Sistemde henüz kullanıcı yok.<br>İlk yönetici hesabını oluşturun.</p>
            <input type="text" id="setupName" class="input-premium" placeholder="Ad Soyad" style="text-transform: none;">
            <input type="text" id="setupUser" class="input-premium" placeholder="Kullanıcı Adı" style="text-transform: none;">
            <input type="password" id="setupPass" class="input-premium" placeholder="Şifre (en az 8 karakter)" style="text-transform: none;">
            <input type="password" id="setupPass2" class="input-premium" placeholder="Şifre (tekrar)" style="text-transform: none;">
            <input type="password" id="setupSettingsPin" inputmode="numeric" class="input-premium" placeholder="Ayarlar PIN (4-12 rakam)" style="text-transform: none;">
            <button onclick="handleSetupAdmin()" class="btn-main">YÖNETİCİ HESABINI OLUŞTUR</button>
        </div>

        <div id="stepCreatePin" class="hidden animate-fade">
            <p class="text-xs font-bold text-slate-300 mb-6 leading-relaxed">Güvenli ve hızlı erişim için<br>4 haneli bir PIN kodu belirleyin.</p>
            <div class="flex justify-center gap-4 mb-8" id="createPinDisplay">
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            </div>
            <div class="grid grid-cols-3 gap-3 max-w-[260px] mx-auto" id="createPinPad">
                </div>
        </div>

        <div id="stepPinLogin" class="hidden animate-fade">
            <p class="text-sm font-black text-white uppercase tracking-tighter mb-1" id="welcomeUser">HOŞ GELDİN, HAKAN</p>
            <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-8">Erişim için PIN kodunuzu girin</p>
            
            <div class="flex justify-center gap-4 mb-10" id="loginPinDisplay">
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            </div>

            <div class="grid grid-cols-3 gap-3 max-w-[260px] mx-auto" id="loginPinPad">
                </div>

            <button onclick="switchAccount()" class="mt-10 text-[9px] font-black text-slate-500 hover:text-blue-400 uppercase tracking-widest transition-all">Farklı Bir Hesapla Gir</button>
        </div>

    </div>

    <script>
        let staff = [];
        const normalizeUsername = (v) => String(v || '').trim().toLowerCase();

        function loadStaffFromLocal() {
            staff = JSON.parse(localStorage.getItem('BiletPro_Staff')) || [];
            if (!Array.isArray(staff)) staff = [];
        }

        let __lastStaffSyncAt = 0;
        // Yalnızca online veritabanına ulaşılıp personel kaydı gerçekten yoksa true olur.
        let __onlineStaffEmpty = false;
        async function refreshStaffFromOnline(force = false) {
            const now = Date.now();
            if (!force && now - __lastStaffSyncAt < 5000) return;

            try {
                if (window.BiletProOnlineStore && typeof window.BiletProOnlineStore.init === 'function') {
                    const initRes = await window.BiletProOnlineStore.init();
                    if (initRes && initRes.mode === 'online' && typeof window.BiletProOnlineStore.pullStaffFromOnline === 'function') {
                        const pullRes = await window.BiletProOnlineStore.pullStaffFromOnline();
                        __onlineStaffEmpty = !!(pullRes && pullRes.reason === 'no_staff_data');
                    }
                }
            } catch (_) {}

            loadStaffFromLocal();
            __lastStaffSyncAt = now;
        }

        loadStaffFromLocal();

        let lastUser = null;
        let tempUser = null; 
        let inputPin = "";
        let pinSubmitLock = false;

        window.onload = async () => {
            if(typeof applyGlobalConfig === 'function') applyGlobalConfig();
            await refreshStaffFromOnline(true);
            sessionStorage.removeItem('BiletPro_LoggedInTab');
            localStorage.removeItem('BiletPro_LastUser');
            showStep(needsSetup() ? 'stepSetup' : 'stepLogin');
        };

        function needsSetup() {
            return __onlineStaffEmpty;
        }

        async function handleSetupAdmin() {
            await refreshStaffFromOnline(true);
            if (!needsSetup()) { showStep('stepLogin'); return; }
            const name = document.getElementById('setupName').value.trim();
            const username = normalizeUsername(document.getElementById('setupUser').value);
            const pass = document.getElementById('setupPass').value;
            const pass2 = document.getElementById('setupPass2').value;
            const pin = document.getElementById('setupSettingsPin').value.trim();
            if (!name || !username) return showLoginToast('❌ Ad ve kullanıcı adı zorunlu', 'error');
            if (pass.length < 8) return showLoginToast('❌ Şifre en az 8 karakter olmalı', 'error');
            if (pass !== pass2) return showLoginToast('❌ Şifreler aynı değil', 'error');
            if (!/^[0-9]{4,12}$/.test(pin)) return showLoginToast('❌ Ayarlar PIN 4-12 rakam olmalı', 'error');

            const perms = {};
            ['pSale','pDiscount','pCancel','pDoor','pDoorPay','pDoorRisk','pManageEvents','pReports','pManageStaff','pViewLogs'].forEach(k => perms[k] = true);
            const admin = { name, username, passwordHash: await window.BiletProSecurity.hashPassword(pass), pin: null, role: 'admin', isActive: true, perms };

            const res = await window.BiletProOnlineStore.pushStaffToOnline([admin]);
            if (!res || !res.ok) return showLoginToast('❌ Kaydedilemedi: ' + ((res && res.reason) || 'bağlantı yok'), 'error');

            localStorage.setItem('BiletPro_Staff', JSON.stringify([admin]));
            const cfg = window.BiletProCore.getConfig();
            cfg.security = { ...(cfg.security || {}), settingsPin: pin };
            window.BiletProCore.saveConfig(cfg);
            loadStaffFromLocal();
            __onlineStaffEmpty = false;
            showLoginToast('✅ Yönetici hesabı oluşturuldu. Giriş yapın.', 'success');
            showStep('stepLogin');
        }

        function showStep(id) {
            document.getElementById('stepLogin').classList.add('hidden');
            document.getElementById('stepSetup').classList.add('hidden');
            document.getElementById('stepCreatePin').classList.add('hidden');
            document.getElementById('stepPinLogin').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        async function handleInitialLogin() {
            await refreshStaffFromOnline();
            const u = document.getElementById('username').value.trim().toLowerCase();
            const p = document.getElementById('password').value;
            
            const user = staff.find(x => normalizeUsername(x && x.username) === u && x && x.isActive !== false);
            const verification = user && window.BiletProSecurity
                ? await window.BiletProSecurity.verifyPassword(user.passwordHash || user.password, p)
                : { ok: false };

            if (user && verification.ok) {
                // Eski düz metin şifreler başarılı girişte tek yönlü özete taşınır.
                if (verification.legacy && window.BiletProSecurity) {
                    user.passwordHash = await window.BiletProSecurity.hashPassword(p);
                    delete user.password;
                    localStorage.setItem('BiletPro_Staff', JSON.stringify(staff));
                    window.BiletProOnlineStore?.pushStaffToOnline?.(staff).catch(() => {});
                }
                if(typeof window.writeAuditEvent === 'function') {
                    window.writeAuditEvent('Güvenlik', 'Giriş Başarılı (Şifre)', `${user.name || user.username} kullanıcı adı/şifre doğrulaması geçti.`);
                }
                tempUser = user;
                if (!user.pin) {
                    showStep('stepCreatePin');
                    renderPad('createPinPad');
                } else {
                    loginComplete(user);
                }
            } else {
                if(typeof window.writeAuditEvent === 'function') {
                    window.writeAuditEvent('Güvenlik', 'Giriş Başarısız (Şifre)', `Kullanıcı: ${u || 'boş'} için hatalı giriş denemesi.`);
                }
                showLoginToast('❌ Kullanıcı adı veya şifre hatalı!', 'error');
                shakeTerminal();
            }
        }

        function renderPad(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            [1,2,3,4,5,6,7,8,9].forEach(n => {
                container.innerHTML += `<button class="num-btn" onclick="pressKey('${n}')">${n}</button>`;
            });
            container.innerHTML += `<button class="num-btn text-red-400" onclick="pressKey('C')">C</button>`;
            container.innerHTML += `<button class="num-btn" onclick="pressKey('0')">0</button>`;
            container.innerHTML += `<button class="num-btn text-blue-400" onclick="pressKey('OK')">OK</button>`;
        }

        function pressKey(key) {
            const currentStep = document.getElementById('stepCreatePin').classList.contains('hidden') ? 'login' : 'create';
            
            if (key === 'C') {
                inputPin = "";
                pinSubmitLock = false;
            } else if (key === 'OK') {
                if (inputPin.length === 4 && !pinSubmitLock) {
                    pinSubmitLock = true;
                    validatePin(currentStep);
                }
            } else {
                if (inputPin.length < 4) inputPin += key;
            }

            updatePinDots(currentStep);
            if (inputPin.length === 4 && !pinSubmitLock) {
                pinSubmitLock = true;
                setTimeout(() => validatePin(currentStep), 300);
            }
        }

        function updatePinDots(step) {
            const dots = document.querySelectorAll(`#${step === 'create' ? 'createPinDisplay' : 'loginPinDisplay'} .pin-dot`);
            dots.forEach((d, i) => d.classList.toggle('active', i < inputPin.length));
        }

        function validatePin(step) {
            if (step === 'create') {
                const userIdx = staff.findIndex(u => normalizeUsername(u && u.username) === normalizeUsername(tempUser && tempUser.username));
                if (userIdx === -1) return shakeTerminal();
                staff[userIdx].pin = inputPin;
                localStorage.setItem('BiletPro_Staff', JSON.stringify(staff));
                if (window.BiletProOnlineStore && typeof window.BiletProOnlineStore.pushStaffToOnline === 'function') {
                    window.BiletProOnlineStore.pushStaffToOnline(staff).catch(() => {});
                }
                if(typeof window.writeAuditEvent === 'function') {
                    window.writeAuditEvent('Güvenlik', 'PIN Oluşturuldu', `${staff[userIdx].name || staff[userIdx].username} için yeni PIN tanımlandı.`);
                }
                loginComplete(tempUser);
            } else {
                const user = staff.find(u => normalizeUsername(u && u.username) === normalizeUsername(lastUser));
                if (user && user.isActive !== false && user.pin === inputPin) {
                    loginComplete(user);
                } else {
                    if(typeof window.writeAuditEvent === 'function') {
                        window.writeAuditEvent('Güvenlik', 'PIN Hatası', `${lastUser || 'bilinmeyen'} hesabında hatalı PIN denemesi.`);
                    }
                    showLoginToast('❌ PIN kodu hatalı!', 'error');
                    inputPin = "";
                    pinSubmitLock = false;
                    updatePinDots('login');
                    shakeTerminal();
                }
            }
        }

        function loginComplete(userData) {
            localStorage.setItem('BiletPro_Session', JSON.stringify({
                name: userData.name,
                role: userData.role,
                username: userData.username,
                time: new Date().toISOString()
            }));

            if(typeof window.writeAuditEvent === 'function') {
                window.writeAuditEvent('Güvenlik', 'Oturum Açıldı', `${userData.name || userData.username} sisteme giriş yaptı.`);
            }

            sessionStorage.setItem('BiletPro_LoggedInTab', '1');
            
            showLoginToast(`✅ Hoş geldin, ${userData.name || userData.username}!`, 'success');

            setTimeout(() => {
                document.getElementById('terminal').style.opacity = "0";
                document.getElementById('terminal').style.transform = "scale(0.9)";
                document.getElementById('terminal').style.transition = "0.5s";
            }, 600);
            
            setTimeout(() => { window.location.href = 'index.html'; }, 1100);
        }

        function switchAccount() {
            localStorage.removeItem('BiletPro_LastUser');
            inputPin = "";
            showStep('stepLogin');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        function shakeTerminal() {
            const t = document.getElementById('terminal');
            t.classList.add('shake');
            setTimeout(() => t.classList.remove('shake'), 400);
        }

        let __toastTimer = null;
        function showLoginToast(message, type) {
            const toast = document.getElementById('loginToast');
            toast.textContent = message;
            toast.className = 'login-toast ' + type;
            clearTimeout(__toastTimer);
            requestAnimationFrame(() => { toast.classList.add('show'); });
            __toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
    </script>
</body>
</html>
